<div id="gameViewport">

  <div id="game">

    <div id="startScreen">

      <!-- ReAll Dash -->
      <div class="gameTitle" id="gameTitle">
        <canvas id="pixelTitle"></canvas>
      </div>

      <!-- GAME OVER -->
      <div class="gameOverTitle" id="gameOverTitle">
        GAME OVER
      </div>

      <div id="gameOverScore"></div>

      <div id="playButtonFrame">
        <button id="playButton">
          PLAY
        </button>
      </div>

    </div>


    <div id="discus"></div>
    <div id="rock"></div>
    <div id="plant"></div>
    <div id="net"></div>
    <div id="food"></div>
    <div id="ground"></div>

    <button id="pauseButton" aria-label="Pauza">
      <span class="pauseIcon"></span>
    </button>

    <div id="score">0</div>

  </div>

</div>
